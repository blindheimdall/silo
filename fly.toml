# SILO on Fly.io. One machine with a volume for residents, workflows, keys and the workspace:
#   fly launch --copy-config --no-deploy --ha=false     choose a name and a region
#   fly secrets set SILO_SECRET=<a long random passphrase>
#   fly deploy
#   fly logs                                            the setup address on the first start
# SILO keeps its data on one disk, so keep one machine: do not scale it out.
app = "silo"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  SILO_WORK_DIR = "/data/workspace"
  TZ = "UTC"

[[mounts]]
  source = "silo_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  # Schedules, triggers and the Telegram bot need SILO awake.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
